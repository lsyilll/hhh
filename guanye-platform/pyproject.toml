[project]
name = "guanye-platform"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["boto3>=1.40,<2", "celery[redis]>=5.5,<6", "redis>=6,<7", "psycopg[binary]>=3.2,<4", "paho-mqtt>=2.1,<3", "httpx>=0.28,<1", "pydantic>=2.11,<3", "PyYAML>=6,<7", "cryptography>=45,<47", "fastapi>=0.115,<1", "uvicorn>=0.35,<1", "prometheus-client>=0.22,<1", "opentelemetry-sdk>=1.36,<2", "opentelemetry-exporter-otlp-proto-http>=1.36,<2", "opentelemetry-instrumentation-fastapi>=0.57b0,<1", "Pillow>=11,<12", "numpy>=1.26,<3", "pyarrow>=20,<24", "pymysql>=1.1,<2", "pytest>=8,<10"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["worker", "model_service"]
[project.optional-dependencies]
experiments = ["mlflow>=3.1,<4", "dvc[s3]>=3.60,<4", "scikit-learn>=1.7,<2", "onnx>=1.18,<2", "onnxruntime>=1.22,<2", "skl2onnx>=1.19,<2"]
[tool.pytest.ini_options]
testpaths = ["tests"]
