name: guanye
x-env: &env
  POSTGRES_USER: guanye
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_config.py first}
  DATABASE_DSN: postgresql://guanye:${POSTGRES_PASSWORD}@postgres:5432/guanye
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  S3_ENDPOINT: http://seaweed:8333
  S3_BUCKET: guanye
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
  MODEL_SERVICE_SECRET: ${MODEL_SERVICE_SECRET}
  OTEL_ENABLED: ${OTEL_ENABLED:-0}
  MODEL_URL: http://models:8082
  KAFKA_BOOTSTRAP: kafka:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
  MLFLOW_TRACKING_URI: http://mlflow:5000
  DORIS_HOST: doris
services:
  postgres:
    image: postgres:17.6
    environment: {POSTGRES_DB: guanye, POSTGRES_USER: guanye, POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'}
    ports: [127.0.0.1:15432:5432]
    volumes: [pg:/var/lib/postgresql/data, './business/src/main/resources/db/migration/V1__workflow.sql:/docker-entrypoint-initdb.d/001.sql:ro', './analytics/postgres-extra.sql:/docker-entrypoint-initdb.d/002.sql:ro']
    healthcheck: {test: [CMD-SHELL, 'pg_isready -U guanye -d guanye'], interval: 5s, timeout: 3s, retries: 20}
    mem_limit: 768m
  redis:
    image: redis:7.4.5-alpine
    command: [redis-server, --requirepass, '${REDIS_PASSWORD}', --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, noeviction]
    ports: [127.0.0.1:16379:6379]
    volumes: [redis:/data]
    mem_limit: 384m
  seaweed:
    image: chrislusf/seaweedfs:3.97
    command: [server, -dir=/data, -ip=seaweed, -ip.bind=0.0.0.0, -filer, -s3, -s3.config=/etc/seaweed/s3.json, -volume.max=8]
    volumes: [seaweed:/data, './.runtime/s3.json:/etc/seaweed/s3.json:ro']
    ports: [127.0.0.1:18333:8333]
    mem_limit: 768m
  business:
    build: ./business
    environment:
      <<: *env
      GUANYE_BRIDGE_SECRET: ${GUANYE_BRIDGE_SECRET}
      DATABASE_URL: jdbc:postgresql://postgres:5432/guanye
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
    ports: [127.0.0.1:18081:8081]
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 768m
  worker:
    build: {context: ., dockerfile: worker/Dockerfile}
    command: [celery, -A, worker.jobs, worker, --concurrency=1, --prefetch-multiplier=1, --loglevel=INFO]
    environment: *env
    volumes: ['./.runtime/artifacts:/artifacts']
    depends_on: [postgres, redis, seaweed]
    mem_limit: 2g
  storage-init:
    build: {context: ., dockerfile: worker/Dockerfile}
    command: [python, -c, 'from worker.common import ensure_bucket; ensure_bucket()']
    environment: *env
    depends_on: [seaweed]
    restart: on-failure
    mem_limit: 256m
  dispatcher:
    build: {context: ., dockerfile: worker/Dockerfile}
    command: [python, -m, worker.dispatcher]
    environment: *env
    depends_on: [postgres, redis]
    mem_limit: 384m
  models:
    profiles: [models]
    build: {context: ., dockerfile: model_service/Dockerfile, args: {INSTALL_SAM3: '${INSTALL_SAM3:-0}'}}
    environment:
      <<: *env
      MODEL_DEVICE: cpu
      MODEL_ROOT: /models
      USER: guanye
      LOGNAME: guanye
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/guanye-cache
      TORCHINDUCTOR_CACHE_DIR: /tmp/guanye-torchinductor
      HF_HOME: /tmp/guanye-hf
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    ports: [127.0.0.1:18082:8082]
    volumes: ['./.runtime/models:/models:ro']
    mem_limit: 12g
  mosquitto:
    profiles: [devices]
    image: eclipse-mosquitto:2.0.22
    ports: [127.0.0.1:18883:8883]
    volumes: ['./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro', './infra/mqtt.acl:/mosquitto/config/acl:ro', './.runtime/pki/broker:/certs:ro', 'mqtt:/mosquitto/data']
    mem_limit: 128m
  device-bridge:
    profiles: [devices]
    build: {context: ., dockerfile: worker/Dockerfile}
    command: [python, -m, worker.device_bridge]
    environment:
      <<: *env
      MQTT_HOST: mosquitto
      MQTT_PORT: '8883'
    volumes: ['./.runtime/pki/client:/certs:ro']
    depends_on: [mosquitto, postgres]
    mem_limit: 256m
  kafka:
    profiles: [analytics]
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [kafka:/tmp/kraft-combined-logs]
    mem_limit: 1g
  flink-jobmanager:
    profiles: [analytics]
    build: ./analytics/flink
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager\njobmanager.memory.process.size: 768m\nparallelism.default: 1"
    ports: [127.0.0.1:18083:8081]
    mem_limit: 1g
  flink-taskmanager:
    profiles: [analytics]
    build: ./analytics/flink
    command: taskmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager\ntaskmanager.memory.process.size: 1024m\ntaskmanager.numberOfTaskSlots: 1\nparallelism.default: 1"
    depends_on: [flink-jobmanager]
    mem_limit: 1400m
  flink-submit:
    profiles: [analytics]
    build: ./analytics/flink
    command: [bash, -ec, '/opt/flink/bin/sql-client.sh -f /jobs/minute_metrics.sql']
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager\nrest.address: flink-jobmanager"
    volumes: ['./analytics/flink/minute_metrics.sql:/jobs/minute_metrics.sql:ro']
    depends_on: [kafka, flink-jobmanager, flink-taskmanager]
    restart: 'no'
    mem_limit: 512m
  doris:
    profiles: [warehouse]
    image: apache/doris:all-in-one-4.1.3
    ports: [127.0.0.1:19030:9030, 127.0.0.1:18030:8030]
    volumes: [doris:/opt/apache-doris/fe/doris-meta, dorisbe:/opt/apache-doris/be/storage]
    mem_limit: 6g
    ulimits: {nofile: {soft: 65535, hard: 65535}}
  analytics-sink:
    profiles: [warehouse]
    build: {context: ., dockerfile: worker/Dockerfile}
    command: [python, -m, worker.analytics_sink]
    environment: *env
    volumes: ['./analytics/doris:/sql:ro']
    depends_on: [doris]
    mem_limit: 384m
  mlflow:
    profiles: [research]
    image: guanye-worker
    build: {context: ., dockerfile: worker/Dockerfile}
    command: [sh, -ec, 'mlflow server --host 0.0.0.0 --port 5000 --workers 1 --backend-store-uri "$$MLFLOW_BACKEND_STORE_URI" --artifacts-destination s3://guanye/mlflow --serve-artifacts --allowed-hosts mlflow:5000,localhost:15000,127.0.0.1:15000']
    environment:
      <<: *env
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg://guanye:${POSTGRES_PASSWORD}@postgres:5432/guanye
      MLFLOW_S3_ENDPOINT_URL: http://seaweed:8333
    ports: [127.0.0.1:15000:5000]
    depends_on: [postgres, seaweed]
    mem_limit: 1g
  airflow:
    profiles: [offline]
    build: ./analytics/airflow
    command: standalone
    environment:
      <<: *env
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://guanye:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET}
    ports: [127.0.0.1:18084:8080]
    volumes: ['./analytics/airflow/dags:/opt/airflow/dags:ro', './.runtime/artifacts:/artifacts', './analytics/doris:/sql:ro']
    depends_on: [postgres]
    mem_limit: 2g
  otel:
    profiles: [monitoring]
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: [--config=/etc/otel.yaml]
    volumes: ['./infra/otel.yaml:/etc/otel.yaml:ro']
    ports: [127.0.0.1:14318:4318]
    mem_limit: 256m
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.6.0
    volumes: ['./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro', './.runtime/metrics-token:/run/secrets/metrics_token:ro', 'prometheus:/prometheus']
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    ports: [127.0.0.1:19090:9090]
    mem_limit: 512m
  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.2.0
    environment: {GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_PASSWORD}', GF_USERS_ALLOW_SIGN_UP: 'false'}
    ports: [127.0.0.1:13000:3000]
    volumes: ['./infra/grafana:/etc/grafana/provisioning:ro', 'grafana:/var/lib/grafana']
    mem_limit: 512m
  tensorrt:
    profiles: [accelerator]
    build: {context: ., dockerfile: model_service/Dockerfile.tensorrt}
    command: [sleep, infinity]
    volumes: ['./.runtime/artifacts:/artifacts', './model_service:/tools:ro']
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]}}}
    mem_limit: 2g
volumes:
  pg: {}
  redis: {}
  seaweed: {}
  mqtt: {}
  kafka: {}
  doris: {}
  dorisbe: {}
  grafana: {}
  prometheus: {}
